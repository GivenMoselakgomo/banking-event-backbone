services:
  # Source of truth: the "core banking system"
  postgres:
    image: postgres
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankadmin
      POSTGRES_PASSWORD: bankadmin
      POSTGRES_DB: corebank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replivation_slots=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankadmin -d corebank"]
      interval: 5s
      timeout: 5s
      retries: 10
    